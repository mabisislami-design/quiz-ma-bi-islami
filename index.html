<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuizLab MA BI ISLAMI</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f5ff;
    color:#222;
}

.container{
    max-width:850px;
    margin:auto;
    padding:20px;
}

.header{
    background:linear-gradient(135deg,#315bea,#6c42d9);
    color:white;
    padding:30px;
    border-radius:20px;
    margin-bottom:20px;
}

.header h1{
    margin:0 0 8px;
}

.card{
    background:white;
    padding:25px;
    border-radius:18px;
    margin-bottom:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

button{
    border:0;
    padding:13px 18px;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

.primary{
    background:#315bea;
    color:white;
}

.secondary{
    background:#e9edff;
    color:#315bea;
}

.danger{
    background:#ffe8ed;
    color:#d22d4c;
}

input,textarea,select{
    width:100%;
    padding:12px;
    margin-top:7px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:10px;
    box-sizing:border-box;
    font-size:15px;
}

textarea{
    height:100px;
}

.hidden{
    display:none;
}

.mode{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.mode button{
    padding:25px;
}

.option{
    padding:15px;
    border:1px solid #ddd;
    border-radius:10px;
    margin:10px 0;
    cursor:pointer;
}

.option:hover{
    background:#eef2ff;
}

.selected{
    background:#dfe6ff;
    border-color:#315bea;
}

.timer{
    background:#ffe8ed;
    color:#d22d4c;
    padding:10px;
    border-radius:10px;
    font-weight:bold;
}

.progress{
    height:8px;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
    margin:15px 0;
}

.progress-bar{
    height:100%;
    background:#315bea;
    width:0%;
}

.question-item{
    border:1px solid #ddd;
    padding:15px;
    border-radius:10px;
    margin:10px 0;
}

.actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.score{
    text-align:center;
    font-size:55px;
    font-weight:bold;
    color:#315bea;
}

@media(max-width:600px){
    .mode{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>📚 QuizLab MA BI ISLAMI</h1>
<p>Website Kuis Pembelajaran</p>
</div>


<!-- MENU UTAMA -->

<div id="menu" class="card">

<h2>Selamat Datang 👋</h2>

<p>Pilih mode yang ingin digunakan.</p>

<div class="mode">

<button class="primary" onclick="modeGuru()">
👩‍🏫<br>
Mode Guru
</button>

<button class="secondary" onclick="modeSiswa()">
👨‍🎓<br>
Mode Siswa
</button>

</div>

</div>


<!-- MODE GURU -->

<div id="guru" class="hidden">

<div class="card">

<h2>👩‍🏫 Mode Guru</h2>

<label>Judul Kuis</label>

<input id="judulKuis"
placeholder="Contoh: Design Algoritma Kelas X">


<label>Pertanyaan</label>

<textarea id="pertanyaan"
placeholder="Tulis pertanyaan..."></textarea>


<label>Pilihan A</label>

<input id="A" placeholder="Jawaban A">


<label>Pilihan B</label>

<input id="B" placeholder="Jawaban B">


<label>Pilihan C</label>

<input id="C" placeholder="Jawaban C">


<label>Pilihan D</label>

<input id="D" placeholder="Jawaban D">


<label>Jawaban Benar</label>

<select id="jawaban">

<option value="0">A</option>
<option value="1">B</option>
<option value="2">C</option>
<option value="3">D</option>

</select>


<div class="actions">

<button class="primary" onclick="tambahSoal()">
➕ Tambah Soal
</button>

<button class="secondary" onclick="bersihkan()">
Bersihkan
</button>

<button class="secondary" onclick="menuUtama()">
← Menu
</button>

</div>

</div>


<div class="card">

<h2>📋 Daftar Soal</h2>

<div id="daftarSoal"></div>

</div>

</div>


<!-- DATA SISWA -->

<div id="dataSiswa" class="hidden">

<div class="card">

<h2>👨‍🎓 Mulai Kuis</h2>


<label>Nama</label>

<input id="namaSiswa"
placeholder="Masukkan nama">


<label>Kelas</label>

<input id="kelasSiswa"
placeholder="Contoh: X">


<label>Jumlah Soal</label>

<select id="jumlahSoal"></select>


<label>Waktu</label>

<select id="waktu">

<option value="5">5 Menit</option>
<option value="10" selected>10 Menit</option>
<option value="15">15 Menit</option>

</select>


<div class="actions">

<button class="primary" onclick="mulaiKuis()">
🚀 Mulai Kuis
</button>

<button class="secondary" onclick="menuUtama()">
← Kembali
</button>

</div>

</div>

</div>


<!-- KUIS -->

<div id="kuis" class="hidden">

<div class="card">

<div style="display:flex;justify-content:space-between;align-items:center">

<strong id="nomorSoal"></strong>

<span class="timer" id="timer">
10:00
</span>

</div>


<div class="progress">

<div class="progress-bar" id="progress"></div>

</div>


<h2 id="teksSoal"></h2>

<div id="pilihan"></div>


<div class="actions">

<button id="sebelumnya"
class="secondary"
onclick="sebelumnya()">

← Sebelumnya

</button>


<button id="berikutnya"
class="primary"
onclick="berikutnya()">

Berikutnya →

</button>


<button id="selesai"
class="primary hidden"
onclick="selesaiKuis()">

✅ Selesai

</button>

</div>

</div>

</div>


<!-- HASIL -->

<div id="hasil" class="hidden">

<div class="card">

<h2 style="text-align:center">
🎉 Hasil Kuis
</h2>

<p id="namaHasil" style="text-align:center"></p>

<div class="score" id="nilai">
0
</div>

<p id="detailHasil" style="text-align:center"></p>

<p id="pesanHasil"
style="text-align:center;font-weight:bold">
</p>


<div class="actions"
style="justify-content:center">

<button class="primary"
onclick="modeSiswa()">

🔄 Kuis Lagi

</button>

<button class="secondary"
onclick="menuUtama()">

🏠 Menu Utama

</button>

</div>

</div>

</div>

</div>


<script>

/* =========================
   DATA SOAL
========================= */

let soal = JSON.parse(
localStorage.getItem("soalQuizLab")
) || [

{
pertanyaan:"Apa yang dimaksud dengan algoritma?",
pilihan:[
"Langkah-langkah teratur untuk menyelesaikan masalah",
"Nama sebuah komputer",
"Jenis jaringan",
"Bahasa pemrograman"
],
benar:0
},

{
pertanyaan:"Flowchart digunakan untuk...",
pilihan:[
"Mengedit foto",
"Menggambarkan alur suatu proses",
"Menyimpan file",
"Membuat video"
],
benar:1
},

{
pertanyaan:"Simbol belah ketupat pada flowchart menunjukkan...",
pilihan:[
"Proses",
"Input",
"Keputusan",
"Mulai"
],
benar:2
}

];


let nomor = 0;

let jawabanSiswa = [];

let soalKuis = [];

let waktu = 600;

let timerInterval;

let nama = "";

let kelas = "";


/* =========================
   MENU
========================= */

function sembunyikanSemua(){

document.getElementById("menu")
.classList.add("hidden");

document.getElementById("guru")
.classList.add("hidden");

document.getElementById("dataSiswa")
.classList.add("hidden");

document.getElementById("kuis")
.classList.add("hidden");

document.getElementById("hasil")
.classList.add("hidden");

}


function menuUtama(){

clearInterval(timerInterval);

sembunyikanSemua();

document.getElementById("menu")
.classList.remove("hidden");

}


function modeGuru(){

sembunyikanSemua();

document.getElementById("guru")
.classList.remove("hidden");

tampilkanSoal();

}


function modeSiswa(){

sembunyikanSemua();

document.getElementById("dataSiswa")
.classList.remove("hidden");

isiJumlahSoal();

}


/* =========================
   GURU
========================= */

function tambahSoal(){

let pertanyaan =
document.getElementById("pertanyaan")
.value.trim();

let A =
document.getElementById("A")
.value.trim();

let B =
document.getElementById("B")
.value.trim();

let C =
document.getElementById("C")
.value.trim();

let D =
document.getElementById("D")
.value.trim();

let benar =
Number(document.getElementById("jawaban").value);


if(
!pertanyaan ||
!A ||
!B ||
!C ||
!D
){

alert("Semua bagian soal harus diisi.");

return;

}


soal.push({

pertanyaan:pertanyaan,

pilihan:[A,B,C,D],

benar:benar

});


localStorage.setItem(
"soalQuizLab",
JSON.stringify(soal)
);


bersihkan();

tampilkanSoal();

alert("Soal berhasil ditambahkan.");

}


function bersihkan(){

document.getElementById("pertanyaan").value="";

document.getElementById("A").value="";

document.getElementById("B").value="";

document.getElementById("C").value="";

document.getElementById("D").value="";

document.getElementById("jawaban").value="0";

}


function tampilkanSoal(){

let daftar =
document.getElementById("daftarSoal");

if(soal.length===0){

daftar.innerHTML =
"<p>Belum ada soal.</p>";

return;

}


daftar.innerHTML="";


soal.forEach(function(s,index){

let div =
document.createElement("div");

div.className="question-item";

div.innerHTML=

"<strong>"+

(index+1)+". "+

s.pertanyaan+

"</strong><br><br>"+

"A. "+s.pilihan[0]+"<br>"+

"B. "+s.pilihan[1]+"<br>"+

"C. "+s.pilihan[2]+"<br>"+

"D. "+s.pilihan[3]+"<br><br>"+

"<b>Jawaban benar: "+

["A","B","C","D"][s.benar]+

"</b><br><br>"+

"<button class='danger' onclick='hapusSoal("+

index+

")'>🗑️ Hapus</button>";

daftar.appendChild(div);

});

}


function hapusSoal(index){

if(confirm("Hapus soal ini?")){

soal.splice(index,1);

localStorage.setItem(
"soalQuizLab",
JSON.stringify(soal)
);

tampilkanSoal();

}

}


/* =========================
   SISWA
========================= */

function isiJumlahSoal(){

let select =
document.getElementById("jumlahSoal");

select.innerHTML="";

for(
let i=1;
i<=soal.length;
i++
){

let option =
document.createElement("option");

option.value=i;

option.textContent=
i+" soal";

select.appendChild(option);

}

if(soal.length>=10){

select.value=10;

}

}


function mulaiKuis(){

nama =
document.getElementById("namaSiswa")
.value.trim();

kelas =
document.getElementById("kelasSiswa")
.value.trim();


if(!nama || !kelas){

alert("Nama dan kelas harus diisi.");

return;

}


if(soal.length===0){

alert("Belum ada soal.");

return;

}


let jumlah =
Number(
document.getElementById("jumlahSoal").value
);


soalKuis =
[...soal]
.sort(()=>Math.random()-0.5)
.slice(0,jumlah);


jawabanSiswa =
Array(jumlah).fill(null);

nomor=0;


waktu =
Number(
document.getElementById("waktu").value
)*60;


sembunyikanSemua();

document.getElementById("kuis")
.classList.remove("hidden");


tampilkanPertanyaan();

mulaiTimer();

}


/* =========================
   PERTANYAAN
========================= */

function tampilkanPertanyaan(){

let s=soalKuis[nomor];


document.getElementById("nomorSoal")
.innerText=

"Soal "+

(nomor+1)+

" dari "+

soalKuis.length;


document.getElementById("teksSoal")
.innerText=

s.pertanyaan;


let pilihan =
document.getElementById("pilihan");

pilihan.innerHTML="";


s.pilihan.forEach(
function(p,index){

let div =
document.createElement("div");

div.className="option";


if(
jawabanSiswa[nomor]===index
){

div.classList.add("selected");

}


div.innerHTML=

"<b>"+

["A","B","C","D"][index]+

".</b> "+p;


div.onclick=function(){

jawabanSiswa[nomor]=index;

tampilkanPertanyaan();

};


pilihan.appendChild(div);

});


document.getElementById("progress")
.style.width=

((nomor+1)/
soalKuis.length*100)+"%";


document.getElementById("sebelumnya")
.style.display=

nomor===0
?"none"
:"inline-block";


if(
nomor===soalKuis.length-1
){

document.getElementById("berikutnya")
.classList.add("hidden");

document.getElementById("selesai")
.classList.remove("hidden");

}else{

document.getElementById("berikutnya")
.classList.remove("hidden");

document.getElementById("selesai")
.classList.add("hidden");

}

}


/* =========================
   NAVIGASI
========================= */

function berikutnya(){

if(
jawabanSiswa[nomor]===null
){

alert("Silakan pilih jawaban.");

return;

}


if(
nomor<
soalKuis.length-1
){

nomor++;

tampilkanPertanyaan();

}

}


function sebelumnya(){

if(nomor>0){

nomor--;

tampilkanPertanyaan();

}

}


/* =========================
   TIMER
========================= */

function mulaiTimer(){

clearInterval(timerInterval);

tampilkanWaktu();


timerInterval=setInterval(
function(){

waktu--;

tampilkanWaktu();


if(waktu<=0){

clearInterval(timerInterval);

alert(
"Waktu habis. Jawaban akan dikumpulkan."
);

selesaiKuis();

}

},
1000
);

}


function tampilkanWaktu(){

let menit =
Math.floor(waktu/60);

let detik =
waktu%60;


document.getElementById("timer")
.innerText=

String(menit).padStart(2,"0")+

":"+

String(detik).padStart(2,"0");

}


/* =========================
   HASIL
========================= */

function selesaiKuis(){

clearInterval(timerInterval);


let benar=0;


soalKuis.forEach(
function(s,index){

if(
jawabanSiswa[index]===s.benar
){

benar++;

}

});


let nilai =
Math.round(
benar/
soalKuis.length*
100
);


sembunyikanSemua();

document.getElementById("hasil")
.classList.remove("hidden");


document.getElementById("namaHasil")
.innerText=

nama+

" • Kelas "+

kelas;


document.getElementById("nilai")
.innerText=

nilai;


document.getElementById("detailHasil")
.innerText=

"Benar "+

benar+

" dari "+

soalKuis.length+

" soal.";


let pesan="";


if(nilai>=90){

pesan="🌟 Luar biasa! Pertahankan!";

}else if(nilai>=80){

pesan="👏 Sangat baik! Terus tingkatkan!";

}else if(nilai>=70){

pesan="👍 Bagus! Terus belajar!";

}else{

pesan="💪 Jangan menyerah. Belajar lagi dan coba kembali!";

}


document.getElementById("pesanHasil")
.innerText=pesan;

}

</script>

</body>
</html>
