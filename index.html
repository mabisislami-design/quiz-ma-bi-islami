<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuizLab MA BI ISLAMI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  min-height:100vh;
  padding:20px;
  color:#1f2937;
}

.container{
  max-width:800px;
  margin:auto;
}

.card{
  background:white;
  border-radius:22px;
  padding:25px;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
  margin-bottom:20px;
}

.header{
  text-align:center;
  color:white;
  margin-bottom:20px;
}

.header h1{
  margin:5px 0;
  font-size:30px;
}

.header p{
  margin:5px;
}

button{
  border:none;
  border-radius:12px;
  padding:13px 18px;
  cursor:pointer;
  font-size:15px;
  font-weight:bold;
}

.btn{
  background:#2563eb;
  color:white;
}

.btn:hover{
  opacity:.9;
}

.btn-secondary{
  background:#e5e7eb;
  color:#111827;
}

.menu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.menu button{
  padding:20px;
}

input,select{
  width:100%;
  padding:13px;
  margin:7px 0 15px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:15px;
}

.option{
  border:2px solid #e5e7eb;
  padding:15px;
  margin:10px 0;
  border-radius:12px;
  cursor:pointer;
}

.option:hover{
  background:#f3f4f6;
}

.option.selected{
  border-color:#2563eb;
  background:#dbeafe;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
  gap:10px;
}

.timer{
  background:#fee2e2;
  color:#b91c1c;
  padding:8px 12px;
  border-radius:10px;
  font-weight:bold;
}

.progress{
  width:100%;
  height:10px;
  background:#e5e7eb;
  border-radius:10px;
  overflow:hidden;
  margin:15px 0;
}

.progress-bar{
  height:100%;
  background:#2563eb;
  width:0%;
  transition:.3s;
}

.actions{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:20px;
}

.center{
  text-align:center;
}

.score{
  font-size:50px;
  font-weight:bold;
  color:#2563eb;
}

.hidden{
  display:none;
}

.loading{
  text-align:center;
  padding:30px;
}

.error{
  background:#fee2e2;
  color:#991b1b;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
}

@media(max-width:600px){
  body{
    padding:10px;
  }

  .card{
    padding:18px;
  }

  .menu{
    grid-template-columns:1fr;
  }

  .header h1{
    font-size:25px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>📚 QuizLab MA BI ISLAMI</h1>
    <p>Website Kuis Pembelajaran</p>
  </div>

  <!-- MENU -->
  <div id="menu" class="card">
    <div class="menu">
      <button class="btn" onclick="modeSiswa()">👨‍🎓 Mode Siswa</button>
      <button class="btn-secondary" onclick="modeGuru()">👩‍🏫 Mode Guru</button>
    </div>
  </div>

  <!-- GURU -->
  <div id="guru" class="card hidden">

    <h2>👩‍🏫 Mode Guru</h2>

    <p>
      Bank soal diambil dari Google Sheets.
      Penambahan soal dilakukan melalui spreadsheet.
    </p>

    <button class="btn" onclick="muatSoalGuru()">🔄 Periksa Bank Soal</button>
    <button class="btn-secondary" onclick="menuUtama()">Menu</button>

    <div id="daftarGuru"></div>

  </div>

  <!-- SISWA -->
  <div id="siswa" class="card hidden">

    <h2>👨‍🎓 Mode Siswa</h2>

    <label>Nama Siswa</label>
    <input id="nama" placeholder="Masukkan nama">

    <label>Kelas</label>
    <input id="kelas" placeholder="Contoh: X">

    <label>Jumlah Soal</label>
    <select id="jumlahSoal"></select>

    <label>Waktu</label>
    <select id="waktu">
      <option value="5">5 Menit</option>
      <option value="10">10 Menit</option>
      <option value="15">15 Menit</option>
    </select>

    <button class="btn" onclick="mulaiKuis()">🚀 Mulai Kuis</button>
    <button class="btn-secondary" onclick="menuUtama()">Kembali</button>

    <div id="loading" class="loading hidden">
      ⏳ Mengambil soal dari Bank Soal...
    </div>

    <div id="error" class="error hidden"></div>

  </div>

  <!-- KUIS -->
  <div id="quiz" class="card hidden">

    <div class="topbar">
      <b id="nomor"></b>
      <div class="timer" id="timer">10:00</div>
    </div>

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <h2 id="pertanyaan"></h2>

    <div id="pilihan"></div>

    <div class="actions">
      <button class="btn-secondary" onclick="sebelumnya()">← Sebelumnya</button>
      <button class="btn" onclick="berikutnya()">Berikutnya →</button>
    </div>

    <br>

    <button class="btn-secondary" onclick="selesaiKuis()">
      🏁 Selesai Kuis
    </button>

  </div>

  <!-- HASIL -->
  <div id="hasil" class="card hidden center">

    <h2>🎉 Hasil Kuis</h2>

    <p id="hasilNama"></p>

    <div class="score" id="nilai">0</div>

    <p id="detailNilai"></p>

    <h3 id="motivasi"></h3>

    <button class="btn" onclick="ulangKuis()">🔄 Ulangi</button>
    <button class="btn-secondary" onclick="menuUtama()">🏠 Menu</button>

  </div>

</div>

<script>

/* ================================
   URL API GOOGLE SHEETS
================================ */

const API_URL =
"https://script.google.com/macros/s/AKfycbyQ7ko2WkvkUVuP-EQyl1NSQeyws2RnV8HHdyLon6zYiRfnINrPO8Gw-0MtIUECuKng/exec";


/* ================================
   DATA
================================ */

let semuaSoal = [];
let soalKuis = [];
let jawabanSiswa = [];
let posisi = 0;
let waktuDetik = 600;
let intervalTimer;


/* ================================
   TAMPILAN
================================ */

function sembunyikanSemua(){

  document.getElementById("menu").classList.add("hidden");
  document.getElementById("guru").classList.add("hidden");
  document.getElementById("siswa").classList.add("hidden");
  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("hasil").classList.add("hidden");

}


function menuUtama(){

  clearInterval(intervalTimer);

  sembunyikanSemua();

  document.getElementById("menu").classList.remove("hidden");

}


function modeSiswa(){

  sembunyikanSemua();

  document.getElementById("siswa").classList.remove("hidden");

  ambilSoal();

}


function modeGuru(){

  sembunyikanSemua();

  document.getElementById("guru").classList.remove("hidden");

  muatSoalGuru();

}


/* ================================
   AMBIL SOAL DARI GOOGLE SHEETS
================================ */

async function ambilSoal(){

  const loading = document.getElementById("loading");
  const error = document.getElementById("error");

  loading.classList.remove("hidden");
  error.classList.add("hidden");

  try{

    const response = await fetch(API_URL);

    if(!response.ok){
      throw new Error("Gagal menghubungi server.");
    }

    semuaSoal = await response.json();

    if(!Array.isArray(semuaSoal) || semuaSoal.length === 0){
      throw new Error("Bank soal masih kosong.");
    }

    isiJumlahSoal();

  }catch(err){

    error.textContent =
      "Gagal mengambil soal. Pastikan API dan Google Sheets aktif.";

    error.classList.remove("hidden");

  }finally{

    loading.classList.add("hidden");

  }

}


/* ================================
   JUMLAH SOAL
================================ */

function isiJumlahSoal(){

  const select = document.getElementById("jumlahSoal");

  select.innerHTML = "";

  const jumlahMaksimal = Math.min(semuaSoal.length,20);

  for(let i=1;i<=jumlahMaksimal;i++){

    const option = document.createElement("option");

    option.value = i;
    option.textContent = i + " Soal";

    select.appendChild(option);

  }

}


/* ================================
   MULAI KUIS
================================ */

function mulaiKuis(){

  const nama = document.getElementById("nama").value.trim();
  const kelas = document.getElementById("kelas").value.trim();

  if(!nama){
    alert("Silakan isi nama siswa.");
    return;
  }

  if(!kelas){
    alert("Silakan isi kelas.");
    return;
  }

  if(semuaSoal.length === 0){
    alert("Soal belum berhasil dimuat.");
    return;
  }

  const jumlah =
    Number(document.getElementById("jumlahSoal").value);

  soalKuis = [...semuaSoal]
    .sort(() => Math.random() - 0.5)
    .slice(0,jumlah);

  jawabanSiswa = new Array(soalKuis.length).fill("");

  posisi = 0;

  const menit =
    Number(document.getElementById("waktu").value);

  waktuDetik = menit * 60;

  sembunyikanSemua();

  document.getElementById("quiz").classList.remove("hidden");

  tampilkanPertanyaan();

  mulaiTimer();

}


/* ================================
   TAMPILKAN PERTANYAAN
================================ */

function tampilkanPertanyaan(){

  const soal = soalKuis[posisi];

  document.getElementById("nomor").textContent =
    "Soal " + (posisi + 1) + " dari " + soalKuis.length;

  document.getElementById("pertanyaan").textContent =
    soal.pertanyaan;

  const pilihan =
    document.getElementById("pilihan");

  pilihan.innerHTML = "";

  const daftarPilihan = ["A","B","C","D"];

  daftarPilihan.forEach(huruf => {

    const div = document.createElement("div");

    div.className = "option";

    if(jawabanSiswa[posisi] === huruf){
      div.classList.add("selected");
    }

    div.textContent =
      huruf + ". " + soal[huruf];

    div.onclick = function(){

      jawabanSiswa[posisi] = huruf;

      tampilkanPertanyaan();

    };

    pilihan.appendChild(div);

  });


  const progress =
    ((posisi + 1) / soalKuis.length) * 100;

  document.getElementById("progressBar").style.width =
    progress + "%";

}


/* ================================
   NAVIGASI
================================ */

function berikutnya(){

  if(posisi < soalKuis.length - 1){

    posisi++;

    tampilkanPertanyaan();

  }else{

    selesaiKuis();

  }

}


function sebelumnya(){

  if(posisi > 0){

    posisi--;

    tampilkanPertanyaan();

  }

}


/* ================================
   TIMER
================================ */

function mulaiTimer(){

  clearInterval(intervalTimer);

  tampilkanWaktu();

  intervalTimer = setInterval(() => {

    waktuDetik--;

    tampilkanWaktu();

    if(waktuDetik <= 0){

      clearInterval(intervalTimer);

      alert("Waktu kuis telah habis.");

      selesaiKuis();

    }

  },1000);

}


function tampilkanWaktu(){

  const menit =
    Math.floor(waktuDetik / 60);

  const detik =
    waktuDetik % 60;

  document.getElementById("timer").textContent =
    String(menit).padStart(2,"0") +
    ":" +
    String(detik).padStart(2,"0");

}


/* ================================
   SELESAI
================================ */

function selesaiKuis(){

  clearInterval(intervalTimer);

  let benar = 0;

  soalKuis.forEach((soal,index) => {

    if(
      jawabanSiswa[index] &&
      jawabanSiswa[index].toUpperCase() ===
      String(soal.jawaban).toUpperCase()
    ){

      benar++;

    }

  });


  const total = soalKuis.length;

  const nilai =
    Math.round((benar / total) * 100);

  const salah = total - benar;

  document.getElementById("hasilNama").textContent =
    document.getElementById("nama").value +
    " — Kelas " +
    document.getElementById("kelas").value;

  document.getElementById("nilai").textContent =
    nilai;

  document.getElementById("detailNilai").textContent =
    "Benar: " + benar +
    " | Salah: " + salah +
    " | Total: " + total;

  let pesan = "";

  if(nilai >= 90){
    pesan = "🌟 Luar biasa! Pertahankan prestasimu!";
  }else if(nilai >= 75){
    pesan = "👏 Bagus! Terus tingkatkan lagi!";
  }else if(nilai >= 60){
    pesan = "💪 Tetap semangat! Belajar dan berlatih lagi.";
  }else{
    pesan = "📚 Jangan menyerah. Coba belajar lagi dan ulangi kuis.";
  }

  document.getElementById("motivasi").textContent =
    pesan;

  sembunyikanSemua();

  document.getElementById("hasil").classList.remove("hidden");

}


/* ================================
   ULANGI
================================ */

function ulangKuis(){

  document.getElementById("nama").value =
    document.getElementById("nama").value;

  document.getElementById("kelas").value =
    document.getElementById("kelas").value;

  sembunyikanSemua();

  document.getElementById("siswa").classList.remove("hidden");

}


/* ================================
   MODE GURU
================================ */

async function muatSoalGuru(){

  const area =
    document.getElementById("daftarGuru");

  area.innerHTML =
    "<p>⏳ Memuat bank soal...</p>";

  try{

    const response =
      await fetch(API_URL);

    semuaSoal =
      await response.json();

    area.innerHTML =
      "<h3>📚 Bank Soal: " +
      semuaSoal.length +
      " soal</h3>";

    semuaSoal.forEach((soal,index) => {

      const div =
        document.createElement("div");

      div.style.border =
        "1px solid #ddd";

      div.style.borderRadius =
        "12px";

      div.style.padding =
        "12px";

      div.style.marginBottom =
        "10px";

      div.innerHTML =
        "<b>" +
        (index+1) +
        ". " +
        soal.pertanyaan +
        "</b><br>" +
        "A. " + soal.A + "<br>" +
        "B. " + soal.B + "<br>" +
        "C. " + soal.C + "<br>" +
        "D. " + soal.D + "<br>" +
        "<b>Jawaban: " +
        soal.jawaban +
        "</b>";

      area.appendChild(div);

    });

  }catch(error){

    area.innerHTML =
      "<div class='error'>Gagal mengambil bank soal.</div>";

  }

}

</script>

</body>
</html>
